name: Audit dependency lockfile refresh (temporary)

on:
  push:
    branches:
      - ci/audit-deps-2026-11-06

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out maintenance branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Apply audited compatible dependency patches
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify clean dependency installation
        run: npm ci
      - name: Run application and scientific validation
        run: npm run validate
      - name: Confirm security audit is clean
        run: npm audit --audit-level=moderate
      - name: Commit validated dependency updates
        run: |
          git config user.name "Biswajit Jana"
          git config user.email "49089568+Biswajit1999@users.noreply.github.com"
          git add -- package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes required."
          else
            git commit -m "Apply verified npm security patch updates"
            git push origin HEAD:refs/heads/ci/audit-deps-2026-11-06
          fi
