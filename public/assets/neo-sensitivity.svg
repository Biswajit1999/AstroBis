<title id="title">AstroBis close-approach sensitivity audit</title><desc id="desc">Comparison of nominal versus uncertainty-robust close approaches and size classifications under an albedo sensitivity interval.</desc>
<style>.bg{fill:#050816}.panel{fill:#0e1730;stroke:#263456}.title{fill:#f8fafc;font:700 34px system-ui}.sub{fill:#a9b7d0;font:17px system-ui}.heading{fill:#e2e8f0;font:700 21px system-ui}.label{fill:#cbd5e1;font:15px system-ui}.value{fill:#f8fafc;font:700 16px system-ui}.track{fill:#1d2945}.note{fill:#93a4bf;font:14px system-ui}</style>
<rect width="1200" height="650" class="bg"/><text x="60" y="68" class="title">Close-approach evidence changes when uncertainty is kept visible</text>
<text x="60" y="101" class="sub">Returned JPL CAD prefix: 7,500 of 39,471 matching rows · 2026-Aug-13 01:34 to 2030-Jul-10 03:18</text>
<rect x="50" y="135" width="535" height="390" rx="20" class="panel"/><rect x="615" y="135" width="535" height="390" rx="20" class="panel"/>
<text x="80" y="180" class="heading">0.05 AU encounter-distance screen</text>
<g><text x="80" y="217" class="label">Nominal distance ≤ 0.05 AU</text><rect x="80" y="225" width="390" height="20" rx="5" class="track"/><rect x="80" y="225" width="390.00" height="20" rx="5" fill="#a78bfa"/><text x="482" y="240" class="value">590</text></g>
<g><text x="80" y="292" class="label">3σ maximum also ≤ 0.05 AU</text><rect x="80" y="300" width="390" height="20" rx="5" class="track"/><rect x="80" y="300" width="262.42" height="20" rx="5" fill="#34d399"/><text x="482" y="315" class="value">397</text></g>
<g><text x="80" y="367" class="label">Nominal-close but interval crosses boundary</text><rect x="80" y="375" width="390" height="20" rx="5" class="track"/><rect x="80" y="375" width="127.58" height="20" rx="5" fill="#fb7185"/><text x="482" y="390" class="value">193</text></g>
<text x="80" y="455" class="note">CAD distance is encounter-specific; it is not Earth MOID.</text>
<text x="645" y="180" class="heading">140 m size screen among nominal-close rows</text>
<g><text x="645" y="217" class="label">Robust large / measured large</text><rect x="645" y="225" width="390" height="20" rx="5" class="track"/><rect x="645" y="225" width="39.66" height="20" rx="5" fill="#34d399"/><text x="1047" y="240" class="value">60</text></g>
<g><text x="645" y="292" class="label">Classification changes across albedo 0.05–0.25</text><rect x="645" y="300" width="390" height="20" rx="5" class="track"/><rect x="645" y="300" width="42.31" height="20" rx="5" fill="#fbbf24"/><text x="1047" y="315" class="value">64</text></g>
<g><text x="645" y="367" class="label">Robust small / measured small</text><rect x="645" y="375" width="390" height="20" rx="5" class="track"/><rect x="645" y="375" width="308.03" height="20" rx="5" fill="#60a5fa"/><text x="1047" y="390" class="value">466</text></g>
<text x="645" y="455" class="note">H=22 spans 106–237 m across the declared albedo bracket.</text>
<text x="60" y="575" class="sub">SENSITIVITY / ENCOUNTER SCREEN — NOT A PHA DESIGNATION, IMPACT PROBABILITY, TORINO SCORE, OR HAZARD ASSESSMENT</text>
